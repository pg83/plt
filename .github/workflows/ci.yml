name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  LIBSTD_REVISION: 852635cec030d1dfe33988cf61942cbbd6908dd2
  UBUNTU_IMAGE: ubuntu:26.04
  GCC_IMAGE: gcc:16.1.0-trixie
  ALPINE_IMAGE: alpine:3.24.1

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out libstd
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pg83/std
          ref: ${{ env.LIBSTD_REVISION }}
          path: .deps/libstd

      - name: Build library and test executables
        run: |
          set -o pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "$UBUNTU_IMAGE" sh dev/ci_linux.sh build clang \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7

  tests-linux:
    name: Tests ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC / glibc
            id: glibc
            image: GCC_IMAGE
            compiler: gcc
            mode: test
          - name: Clang / Alpine musl
            id: musl
            image: ALPINE_IMAGE
            compiler: clang
            mode: test
          - name: Clang / ASan
            id: asan
            image: UBUNTU_IMAGE
            compiler: clang
            mode: asan
          - name: Clang / UBSan
            id: ubsan
            image: UBUNTU_IMAGE
            compiler: clang
            mode: ubsan
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out libstd
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pg83/std
          ref: ${{ env.LIBSTD_REVISION }}
          path: .deps/libstd

      - name: Run unit and Wayland integration tests
        env:
          CI_IMAGE: ${{ env[matrix.image] }}
          CI_COMPILER: ${{ matrix.compiler }}
          CI_MODE: ${{ matrix.mode }}
        run: |
          set -o pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "$CI_IMAGE" sh dev/ci_linux.sh "$CI_MODE" "$CI_COMPILER" \
            2>&1 | tee "$RUNNER_TEMP/tests-${{ matrix.id }}.log"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.id }}-log
          path: ${{ runner.temp }}/tests-${{ matrix.id }}.log
          if-no-files-found: ignore
          retention-days: 7

  tests-darwin:
    name: Tests Darwin / Clang
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out libstd
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pg83/std
          ref: ${{ env.LIBSTD_REVISION }}
          path: .deps/libstd

      - name: Install LLVM
        run: brew install llvm@21

      - name: Run unit and Cocoa tests
        run: |
          set -o pipefail
          export PATH="$(brew --prefix llvm@21)/bin:$PATH"
          export CC=clang CXX=clang++
          bash dev/ci.sh test 2>&1 | tee "$RUNNER_TEMP/tests-darwin.log"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-darwin-log
          path: ${{ runner.temp }}/tests-darwin.log
          if-no-files-found: ignore
          retention-days: 7

  coverage-platform:
    name: Coverage ${{ matrix.platform }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: darwin
            runner: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out libstd
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pg83/std
          ref: ${{ env.LIBSTD_REVISION }}
          path: .deps/libstd

      - name: Run Linux tests with coverage
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "$UBUNTU_IMAGE" sh dev/ci_linux.sh coverage clang \
            2>&1 | tee "$RUNNER_TEMP/coverage-${{ matrix.platform }}.log"

      - name: Install LLVM
        if: runner.os == 'macOS'
        run: brew install llvm@21

      - name: Run Darwin tests with coverage
        if: runner.os == 'macOS'
        run: |
          set -o pipefail
          export PATH="$(brew --prefix llvm@21)/bin:$PATH"
          export CC=clang CXX=clang++
          bash dev/ci.sh coverage 2>&1 | tee "$RUNNER_TEMP/coverage-${{ matrix.platform }}.log"

      - name: Upload platform tracefile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.platform }}
          path: |
            .build/coverage/coverage.info
            .build/coverage/summary.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.platform }}-log
          path: ${{ runner.temp }}/coverage-${{ matrix.platform }}.log
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    name: Coverage
    needs: [build, coverage-platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download platform tracefiles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: ${{ runner.temp }}/coverage-inputs

      - name: Merge Linux and Darwin coverage
        run: |
          report="$RUNNER_TEMP/coverage-report"
          mkdir -p "$report"
          python3 dev/merge_lcov.py \
            --output "$report/coverage.info" \
            --summary "$report/summary.txt" \
            "$RUNNER_TEMP/coverage-inputs/coverage-linux/coverage.info" \
            "$RUNNER_TEMP/coverage-inputs/coverage-darwin/coverage.info"
          {
            echo '## Linux + Darwin coverage'
            echo
            echo '```text'
            cat "$report/summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coverage-report
          if-no-files-found: error
          retention-days: 14

      - name: Upload merged coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ${{ runner.temp }}/coverage-report/coverage.info
          disable_search: true
          fail_ci_if_error: true
          name: linux-darwin
