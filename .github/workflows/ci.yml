name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  LIBSTD_REVISION: 852635cec030d1dfe33988cf61942cbbd6908dd2
  UBUNTU_IMAGE: ubuntu:26.04
  GCC_IMAGE: gcc:16.1.0-trixie
  ALPINE_IMAGE: alpine:3.24.1

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out libstd
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pg83/std
          ref: ${{ env.LIBSTD_REVISION }}
          path: .deps/libstd

      - name: Build library and test executables
        run: |
          set -o pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "$UBUNTU_IMAGE" sh dev/ci_linux.sh build clang \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7

  tests-glibc:
    name: Tests GCC / glibc
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out libstd
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pg83/std
          ref: ${{ env.LIBSTD_REVISION }}
          path: .deps/libstd

      - name: Run Wayland integration and e2e tests
        env:
          CI_IMAGE: ${{ env.GCC_IMAGE }}
          CI_COMPILER: gcc
          CI_MODE: test
        run: |
          set -o pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "$CI_IMAGE" sh dev/ci_linux.sh "$CI_MODE" "$CI_COMPILER" \
            2>&1 | tee "$RUNNER_TEMP/tests-glibc.log"

      - name: Upload e2e screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-glibc-e2e
          path: .build/ci-test/e2e-*/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-glibc-log
          path: ${{ runner.temp }}/tests-glibc.log
          if-no-files-found: ignore
          retention-days: 7

  tests-musl:
    name: Tests Clang / Alpine musl
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out libstd
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pg83/std
          ref: ${{ env.LIBSTD_REVISION }}
          path: .deps/libstd

      - name: Run Wayland integration and e2e tests
        env:
          CI_IMAGE: ${{ env.ALPINE_IMAGE }}
          CI_COMPILER: clang
          CI_MODE: test
        run: |
          set -o pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "$CI_IMAGE" sh dev/ci_linux.sh "$CI_MODE" "$CI_COMPILER" \
            2>&1 | tee "$RUNNER_TEMP/tests-musl.log"

      - name: Upload e2e screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-musl-e2e
          path: .build/ci-test/e2e-*/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-musl-log
          path: ${{ runner.temp }}/tests-musl.log
          if-no-files-found: ignore
          retention-days: 7

  tests-asan:
    name: Tests Clang / ASan
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out libstd
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pg83/std
          ref: ${{ env.LIBSTD_REVISION }}
          path: .deps/libstd

      - name: Run Wayland integration and e2e tests
        env:
          CI_IMAGE: ${{ env.UBUNTU_IMAGE }}
          CI_COMPILER: clang
          CI_MODE: asan
        run: |
          set -o pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "$CI_IMAGE" sh dev/ci_linux.sh "$CI_MODE" "$CI_COMPILER" \
            2>&1 | tee "$RUNNER_TEMP/tests-asan.log"

      - name: Upload e2e screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-asan-e2e
          path: .build/ci-asan/e2e-*/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-asan-log
          path: ${{ runner.temp }}/tests-asan.log
          if-no-files-found: ignore
          retention-days: 7

  tests-ubsan:
    name: Tests Clang / UBSan
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out libstd
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pg83/std
          ref: ${{ env.LIBSTD_REVISION }}
          path: .deps/libstd

      - name: Run Wayland integration and e2e tests
        env:
          CI_IMAGE: ${{ env.UBUNTU_IMAGE }}
          CI_COMPILER: clang
          CI_MODE: ubsan
        run: |
          set -o pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "$CI_IMAGE" sh dev/ci_linux.sh "$CI_MODE" "$CI_COMPILER" \
            2>&1 | tee "$RUNNER_TEMP/tests-ubsan.log"

      - name: Upload e2e screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-ubsan-e2e
          path: .build/ci-ubsan/e2e-*/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-ubsan-log
          path: ${{ runner.temp }}/tests-ubsan.log
          if-no-files-found: ignore
          retention-days: 7

  tests-darwin:
    name: Tests Darwin / Clang
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out libstd
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pg83/std
          ref: ${{ env.LIBSTD_REVISION }}
          path: .deps/libstd

      - name: Install LLVM
        run: brew install llvm@21

      - name: Run Cocoa tests
        run: |
          set -o pipefail
          export PATH="$(brew --prefix llvm@21)/bin:$PATH"
          export CC=clang CXX=clang++
          bash dev/ci.sh test 2>&1 | tee "$RUNNER_TEMP/tests-darwin.log"

      - name: Upload native e2e screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-darwin-e2e
          path: .build/ci-test/e2e-metal/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-darwin-log
          path: ${{ runner.temp }}/tests-darwin.log
          if-no-files-found: ignore
          retention-days: 7

  coverage-linux:
    name: Coverage linux
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out libstd
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pg83/std
          ref: ${{ env.LIBSTD_REVISION }}
          path: .deps/libstd

      - name: Run Linux tests with coverage
        run: |
          set -o pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            "$UBUNTU_IMAGE" sh dev/ci_linux.sh coverage clang \
            2>&1 | tee "$RUNNER_TEMP/coverage-linux.log"

      - name: Upload coverage e2e screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-e2e-artifacts
          path: .build/ci-coverage/e2e-*/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload platform tracefile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-linux
          path: |
            .build/coverage/coverage.info
            .build/coverage/summary.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-linux-log
          path: ${{ runner.temp }}/coverage-linux.log
          if-no-files-found: ignore
          retention-days: 7

  coverage-darwin:
    name: Coverage darwin
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out libstd
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pg83/std
          ref: ${{ env.LIBSTD_REVISION }}
          path: .deps/libstd

      - name: Install LLVM
        run: brew install llvm@21

      - name: Run Darwin tests with coverage
        run: |
          set -o pipefail
          export PATH="$(brew --prefix llvm@21)/bin:$PATH"
          export CC=clang CXX=clang++
          bash dev/ci.sh coverage 2>&1 | tee "$RUNNER_TEMP/coverage-darwin.log"

      - name: Upload native e2e screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-darwin-e2e
          path: .build/ci-coverage/e2e-metal/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload platform tracefile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-darwin
          path: |
            .build/coverage/coverage.info
            .build/coverage/summary.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-darwin-log
          path: ${{ runner.temp }}/coverage-darwin.log
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    name: Coverage
    needs: [build, coverage-linux, coverage-darwin]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download platform tracefiles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: ${{ runner.temp }}/coverage-inputs

      - name: Merge Linux and Darwin coverage
        run: |
          report="$RUNNER_TEMP/coverage-report"
          mkdir -p "$report"
          python3 dev/merge_lcov.py \
            --minimum-line-coverage 90 \
            --minimum-branch-coverage 90 \
            --output "$report/coverage.info" \
            --summary "$report/summary.txt" \
            "$RUNNER_TEMP/coverage-inputs/coverage-linux/coverage.info" \
            "$RUNNER_TEMP/coverage-inputs/coverage-darwin/coverage.info"
          {
            echo '## Linux + Darwin coverage'
            echo
            echo '```text'
            cat "$report/summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: ${{ runner.temp }}/coverage-report
          if-no-files-found: error
          retention-days: 14

      - name: Upload merged coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ${{ runner.temp }}/coverage-report/coverage.info
          disable_search: true
          fail_ci_if_error: true
          name: linux-darwin
